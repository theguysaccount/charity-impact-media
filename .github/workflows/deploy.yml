# Build the static site from the latest data release and deploy it to GitHub Pages.
# Runs after a data refresh (refresh.yml dispatches it), on site changes, when the daily
# health check sees new right-of-reply issues, or by hand. If any step fails, Pages keeps
# serving the previous deployment.
name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", "content/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CIM_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  CIM_REPO: ${{ github.repository }}
  CIM_SUPPORT_URL: ${{ vars.CIM_SUPPORT_URL }}   # optional: sponsor or donation link (the money slot)
  CIM_GOATCOUNTER: ${{ vars.CIM_GOATCOUNTER }}   # optional: https://<code>.goatcounter.com/count
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ready: ${{ steps.data.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest data release
        id: data
        run: |
          mkdir -p data/work
          if gh release download --repo "$GITHUB_REPOSITORY" --dir data/work \
               --pattern filings.jsonl.gz --pattern first_seen.json.gz --pattern coverage.json.gz --pattern fetch_stats.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"; ls -la data/work
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"; echo "No data release yet: run the Refresh data workflow first."
          fi
      - name: Tests
        if: steps.data.outputs.ready == 'true'
        run: python3 -m unittest discover -s tests -v
      - name: Build data, share cards and pages
        if: steps.data.outputs.ready == 'true'
        run: |
          pip install --quiet pillow==11.3.0
          python3 pipeline/crosslinks.py
          python3 pipeline/replies.py
          python3 pipeline/build_data.py
          python3 pipeline/og_cards.py
          python3 pipeline/build_site.py
          cp data/work/replies.json dist/assets/replies.json 2>/dev/null || echo '{}' > dist/assets/replies.json
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.ready == 'true'
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: steps.data.outputs.ready == 'true'
        with:
          name: urls
          path: data/work/urls_*.txt
          retention-days: 7

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: urls
      - name: Submit changed pages to IndexNow
        run: python3 pipeline/indexnow.py urls_changed.txt || true
